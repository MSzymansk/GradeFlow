<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Lista uczniów</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        /*Przycisk "dodaj ucznia"*/
        .buttons {
            margin-top: 20px;
            text-align: left;
        }

        .buttons button {
            margin-left: 10px;
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .open-form-button {
            background: #cccccc;
            color: black;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        /*Formularz do ddoania ucznia*/
        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 60%;
            max-width: 500px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
        }

        .close-btn:hover {
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .form-buttons {
            margin-top: 20px;
            text-align: right;
        }

        .form-buttons button {
            margin-left: 10px;
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .cancel-btn {
            background-color: #f44336;
            color: white;
        }

        button[type="submit"] {
            background-color: #4CAF50;
            color: white;
        }
    </style>
</head>
<body>
<h1>Lista uczniów</h1>
<!--Przycisk do odpalania fromularza-->
<div class="buttons">
    <button onclick="openStudentForm()" style="margin-bottom: 20px;" class="open-form-button">Dodaj ucznia</button>
</div>
<!--Formularz do wprowadzenia nowego ucznia-->
<div id="student-modal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeStudentForm()">&times;</span>
        <h2>Dodaj nowego ucznia</h2>
        <form id="student-form">
            <div class="form-group">
                <label for="student-name">Imię:</label>
                <input type="text" id="student-name" name="name" required>
            </div>
            <div class="form-group">
                <label for="student-surname">Nazwisko:</label>
                <input type="text" id="student-surname" name="surname" required>
            </div>
            <div class="form-group">
                <label for="student-pesel">PESEL:</label>
                <input type="text" id="student-pesel" name="pesel" required pattern="[0-9]{11}"
                       title="PESEL musi zawierać 11 cyfr">
            </div>
            <div class="form-group">
                <label for="class_id">ID klasy:</label>
                <input type="text" id="class_id" name="class_id" required>
            </div>
            <div class="form-buttons">
                <button type="button" class="cancel-btn" onclick="closeStudentForm()">Anuluj</button>
                <button type="submit" onclick="addStudentToDb()">Dodaj</button>
            </div>
        </form>
    </div>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Imię</th>
        <th>Nazwisko</th>
        <th>PESEL</th>
        <th>ID klasy</th>
    </tr>
    </thead>
    <tbody>
    {% for student in students %}
    <tr>
        <td>{{ student.id }}</td>
        <td>{{ student.name }}</td>
        <td>{{ student.surname }}</td>
        <td>{{ student.pesel }}</td>
        <td>{{ student.class_id }}</td>
    </tr>
    {% endfor %}
    </tbody>
</table>
<!--Odniesienie do pliku student_actions.js-->
<script src="{{ url_for('static', filename='student_actions.js') }}"></script>

</body>
</html>

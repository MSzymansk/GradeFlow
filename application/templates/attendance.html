{% extends 'base.html' %}

{% block content %}
    <html lang="pl">
    <head>
        <meta charset="UTF-8">
        <title>Lista uczniów</title>
        <style>
            body {
                font-family: Arial;
                padding: 20px;
            }

            table {
                border-collapse: collapse;
                width: 100%;
            }

            th, td {
                border: 1px solid #ccc;
                padding: 8px;
                text-align: left;
            }

            th {
                background-color: #f2f2f2;
            }

        .buttons {
            margin-top: 20px;
            margin-bottom: 20px;
            text-align: left;
            display: flex;
            align-items: center;
        }

        .buttons button{
            margin-left: 10px;
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

            .open-form-button {
                background: #cccccc;
                color: black;
            }

            .modal {
                display: none;
                position: fixed;
                z-index: 1000;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.5);
            }

            /*Formularz do ddoania ucznia*/
            .modal-content {
                background-color: white;
                margin: 10% auto;
                padding: 20px;
                border-radius: 8px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
                width: 60%;
                max-width: 500px;
                position: relative;
            }

            .close-btn {
                position: absolute;
                top: 10px;
                right: 15px;
                font-size: 24px;
                font-weight: bold;
                color: #aaa;
                cursor: pointer;
            }

            .close-btn:hover {
                color: #333;
            }

            .form-group {
                margin-bottom: 15px;
            }

            label {
                display: block;
                margin-bottom: 5px;
                font-weight: bold;
            }

            input[type="text"] {
                width: 100%;
                padding: 8px;
                border: 1px solid #ddd;
                border-radius: 4px;
                box-sizing: border-box;
            }

            .form-buttons {
                margin-top: 20px;
                text-align: right;
            }

            .form-buttons button {
                margin-left: 10px;
                padding: 8px 15px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
            }

            .cancel-btn {
                background-color: #f44336;
                color: white;
            }

            button[type="submit"] {
                background-color: #4CAF50;
                color: white;
            }
        </style>
    </head>
    <div style="align-items: center;display: flex;justify-content: space-between; padding: 10px;background: #cccccc;border-style: solid;border-radius: 8px;border-width: 4px;margin: 50px;">
        <h1>
            Przeprowadzone Lekcje
        </h1>
        <div>

        </div>

    </div>
    <div class="buttons">
        <a href="{{ url_for('attendance.new_lesson')}}">
            <button>
                Nowa lekcja
            </button>
        </a>
    </div>
    <table>
        <thead>
        <tr>
            <th>Data</th>
            <th>Godzina</th>
            <th>Klasa</th>
            <th>Akcja</th>
        </tr>
        </thead>
        <tbody>
        {% for lesson in lessons %}
            <tr>
                <td>{{ lesson.data }}</td>
                <td>{{ lesson.godzina }}</td>
                <td>{{ lesson.klasa }}</td>
                <td>
                    <a href="{{ url_for('attendance.szczegoly_lesson', data=lesson.data, klasa=lesson.klasa) }}">
                        <button type="button">Szczegóły</button>
                    </a>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>


    </body>
    </html>

{% endblock %}

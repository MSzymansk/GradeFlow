<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Dziennik Nauczyciela{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary ">
    <div class="container-fluid">
        <a class="navbar-brand" href="{{ url_for('dashboard.dashboard') }} " style="font-family: 'Press Start 2P';">GradeFlow</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse " id="navbarNavAltMarkup">
            <div class="navbar-nav">
                <a class="nav-link" aria-current="page" href="{{ url_for('dashboard.dashboard') }}">Strona główna</a>
                <a class="nav-link" href="{{ url_for('students.get_all') }}">Uczniowie</a>
                <a class="nav-link" href="{{ url_for('grades.get_all') }}">Oceny</a>
                <a class="nav-link" href="{{ url_for('attendance.get_lessons_list') }}">Obecność</a>
                <a class="nav-link" href="{{ url_for('auth.logout') }}">Wyloguj</a>
            </div>
        </div>
    </div>
</nav>
<hr>

<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
